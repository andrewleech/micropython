[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpy-analysis"
version = "0.1.0"
description = "Static analysis and SBOM tooling for MicroPython firmware projects"
requires-python = ">=3.10"
# compiledb generates the compilation databases; pinned because its entry format is what the
# completeness check and the cppcheck inputs were proved against.
# reuse is the REUSE tool, which checks the licence and origin declarations (REUSE.toml) of the
# code copied into an analysed repository; pinned so what it checks does not move between runs.
# Its charset-normalizer extra gives it an encoding detector that needs no system library: without
# one, reuse finds libmagic or refuses to start, and the build image has no libmagic.
dependencies = ["compiledb==0.10.7", "reuse[charset-normalizer]==6.2.0"]

# The analysed project calls these; it does not carry them. A project installs this package from
# its MicroPython checkout and calls these entry points; it holds its own analysis policy.
[project.scripts]
sast-install-tools = "mpy_analysis.install:main"
sast-cppcheck-inputs = "mpy_analysis.cppcheck_inputs:main"
sast-cppcheck-coverage = "mpy_analysis.coverage:main"
sast-codechecker-coverage = "mpy_analysis.codechecker_coverage:main"
sast-fanalyzer = "mpy_analysis.fanalyzer:main"
sast-compdb = "mpy_analysis.compdb:main"
sast-run = "mpy_analysis.runner:main"
sast-scope = "mpy_analysis.scope:main"
sast-check-fixtures = "mpy_analysis.fixtures:main"

[tool.setuptools]
packages = ["mpy_analysis"]

[tool.setuptools.package-data]
mpy_analysis = ["data/*", "data/pysa/*/*.pysa", "data/pysa/*/*.json", "data/fixtures/*.py"]
