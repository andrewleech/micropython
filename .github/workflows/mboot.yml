name: Mboot

on:
  push:
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - 'lib/littlefs/**'
      - 'lib/CMSIS_6'
      - 'lib/mcuboot'
      - 'lib/oofatfs/**'
      - 'lib/uzlib/**'
      - 'lib/stm32lib'
      - 'ports/stm32/**'
      - 'shared/mboot/**'
      - 'tests/mboot/keys/**'
      - 'tools/ci.sh'
      - 'tools/mboot_*.py'
      - 'tools/pydfu.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install packages
      run: tools/ci.sh mboot_setup
    - name: Check pydfu protocol
      run: tools/ci.sh mboot_python_test

  stm32:
    strategy:
      fail-fast: false
      matrix:
        ci_func:  # names are functions in ci.sh
          - mboot_stm32_bootloader_build
          - mboot_stm32_app_build
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
    - name: Install packages
      run: tools/ci.sh stm32_setup mboot_setup && tools/ci.sh stm32_path >> "$GITHUB_PATH"
    - name: Build ci_${{ matrix.ci_func }}
      run: tools/ci.sh ${{ matrix.ci_func }}
