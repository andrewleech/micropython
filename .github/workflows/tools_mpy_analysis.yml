name: mpy_analysis tools

on:
  push:
  pull_request:
    paths:
      - '.github/workflows/tools_mpy_analysis.yml'
      - 'tools/mpy_analysis/**'
      - 'tools/mpy_build_inputs/**'
      - 'lib/**'
      - 'LICENSE'
      - 'py/mpconfig.h'
      - 'ports/unix/**'
      - 'ports/stm32/**'
      - 'ports/esp32/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Every library checkout must be present: the version and licence drift checks fail
    # instead of skipping when one is missing.
    runs-on: ubuntu-latest
    env:
      MPY_REQUIRE_SUBMODULES: 1
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Fetch every submodule
      run: git submodule update --init --recursive
    - name: Install the tools
      run: pip install ./tools/mpy_build_inputs ./tools/mpy_analysis pytest
    - name: Run the regressions
      # The two suites each have a conftest.py, so they run as separate pytest sessions.
      run: |
        PYTHONPATH=tools/mpy_analysis:tools python -m pytest -q tools/mpy_analysis/tests
        PYTHONPATH=tools python -m pytest -q tools/mpy_build_inputs/tests

  sbom_unix:
    # Each sbom_* job builds a port, derives link evidence from the build and generates both
    # SBOM formats (see tools/mpy_analysis/ci.sh). The SPDX output must pass the reference
    # validator, the summary must report no gaps and the firmware-complete policy must hold.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Fetch the libraries
      run: git submodule update --init --recursive
    - name: Install the tools
      run: pip install ./tools/mpy_build_inputs ./tools/mpy_analysis "spdx-tools>=0.8,<0.9"
    - name: Install the build dependencies
      run: sudo apt-get update && sudo apt-get install -y libffi-dev pkg-config
    - name: Build and generate the SBOMs
      run: tools/mpy_analysis/ci.sh sbom_unix

  sbom_stm32:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Fetch the libraries
      run: git submodule update --init --recursive
    - name: Install the tools
      run: pip install ./tools/mpy_build_inputs ./tools/mpy_analysis "spdx-tools>=0.8,<0.9"
    - name: Install the cross compiler
      run: tools/ci.sh gcc_arm_setup
    - name: Build and generate the SBOMs
      run: tools/mpy_analysis/ci.sh sbom_stm32

  sbom_esp32:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Fetch the libraries
      run: git submodule update --init --recursive
    - name: Install the tools
      run: pip install ./tools/mpy_build_inputs ./tools/mpy_analysis "spdx-tools>=0.8,<0.9"
    - name: Setup ESP-IDF
      uses: ./.github/actions/setup_esp32
      with:
        idf_ver: v5.5.5
        ccache_key: sbom
    - name: Build
      run: tools/mpy_analysis/ci.sh sbom_esp32_build
    - name: Generate the SBOMs
      run: tools/mpy_analysis/ci.sh sbom_esp32
